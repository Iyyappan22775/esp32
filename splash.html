<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technovation - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            background: linear-gradient(180deg, #000000 0%, #0A0E27 50%, #000000 100%);
        }

        .splash-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* Center glow */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.1) 40%, transparent 70%);
            opacity: 0;
            animation: glowFade 0.5s ease-in forwards;
        }

        /* Light streaks */
        .streaks {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .streak {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 2px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.4), transparent);
            transform-origin: top center;
            opacity: 0;
        }

        .streak:nth-child(1) { transform: rotate(0deg); height: 0; animation: streakGrow 0.7s 0.3s ease-out forwards; }
        .streak:nth-child(2) { transform: rotate(45deg); height: 0; animation: streakGrow 0.7s 0.35s ease-out forwards; }
        .streak:nth-child(3) { transform: rotate(90deg); height: 0; animation: streakGrow 0.7s 0.4s ease-out forwards; }
        .streak:nth-child(4) { transform: rotate(135deg); height: 0; animation: streakGrow 0.7s 0.45s ease-out forwards; }
        .streak:nth-child(5) { transform: rotate(180deg); height: 0; animation: streakGrow 0.7s 0.5s ease-out forwards; }
        .streak:nth-child(6) { transform: rotate(225deg); height: 0; animation: streakGrow 0.7s 0.55s ease-out forwards; }
        .streak:nth-child(7) { transform: rotate(270deg); height: 0; animation: streakGrow 0.7s 0.6s ease-out forwards; }
        .streak:nth-child(8) { transform: rotate(315deg); height: 0; animation: streakGrow 0.7s 0.65s ease-out forwards; }

        /* Logo container */
        .logo-container {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transform: scale(1.2);
            animation: logoAppear 1s 0.8s ease-out forwards, logoPulse 0.5s 2s ease-in-out forwards, logoMove 0.5s 2.3s ease-in-out forwards;
        }

        .logo-container img {
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }

        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        .logo-name-img {
            height: 80px;
            object-fit: contain;
        }

        /* Light sweep */
        .sweep {
            position: absolute;
            width: 150px;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            opacity: 0;
            animation: sweepMove 0.7s 1.5s ease-in-out forwards;
        }

        /* Animations */
        @keyframes glowFade {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes streakGrow {
            0% { height: 0; opacity: 0; }
            50% { opacity: 1; }
            100% { height: 400px; opacity: 0.6; }
        }

        @keyframes logoAppear {
            0% { opacity: 0; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes logoMove {
            0% {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                top: 23px;
                left: 60px;
                transform: translate(0, 0) scale(0.35);
            }
        }

        @keyframes sweepMove {
            0% { left: -150px; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        /* Fade out entire splash */
        .splash-container.fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }
    </style>
</head>
<body>
    <div class="splash-container" id="splashScreen">
        <!-- Center glow -->
        <div class="glow"></div>

        <!-- Light streaks -->
        <div class="streaks">
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
            <div class="streak"></div>
        </div>

        <!-- Logo -->
        <div class="logo-container">
            <img src="LOGO.JPG" alt="Logo" class="logo-img">
            <img src="Logo Final.PNG" alt="Technovation" class="logo-name-img">
        </div>

        <!-- Light sweep -->
        <div class="sweep"></div>
    </div>

    <script>
        // Redirect to main page after animation completes
        setTimeout(() => {
            document.getElementById('splashScreen').classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 500);
        }, 2800);
    </script>
</body>
</html>
